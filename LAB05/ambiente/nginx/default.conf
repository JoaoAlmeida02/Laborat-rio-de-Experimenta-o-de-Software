# Configuração enxuta do Nginx como proxy FastCGI para o PHP-FPM (LAB05).
# Mantida idêntica em todos os tratamentos (T1..T4).

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 16m;

    # Desliga access_log para evitar ruído de I/O durante os testes de carga
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Endpoint leve de healthcheck do próprio Nginx (sem acionar PHP-FPM)
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Bloqueia acesso direto a arquivos ocultos (ex.: .htaccess)
    location ~ /\. {
        deny all;
    }

    # Roteamento padrão do WordPress (necessário para /wp-json/wp/v2/posts)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Proxy FastCGI para o serviço PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
    }

    # Arquivos estáticos servidos diretamente pelo Nginx
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1h;
        log_not_found off;
    }
}
