; Configuração base do PHP para o LAB05 — idêntica em todos os tratamentos (T1..T4).
; A diretiva session.upload_progress.enabled é controlada separadamente no entrypoint
; em /usr/local/etc/php/conf.d/99-lab05-mitigacao.ini.

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 16M
post_max_size = 16M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; OPcache fixo e sem revalidação de timestamp para reduzir ruído de disco nas medições
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Sessões armazenadas em diretório temporário dedicado
session.save_handler = files
session.save_path = /tmp/php-sessions
session.use_strict_mode = 1
