; Configuração do pool PHP-FPM para o LAB05 — idêntica em todos os tratamentos (T1..T4).
; Pool estático evita variação de latência causada por criação/destruição de workers.

[www]
pm = static
pm.max_children = 16
pm.max_requests = 0

; Endpoints internos de monitoramento e healthcheck
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Reduz ruído de I/O durante o teste de carga
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
